[package]
name = "afu-iptv"
version = "1.0.0"
description = "AFU IPTV desktop app"
edition = "2021"
publish = false

[lib]
name = "afu_iptv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
